<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Hello BreakerSpace!</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/assets/favicon-32x32.png" sizes="32x32">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" sizes="180x180">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="/script.js"></script>
</head>
<body class="bg-background-dark text-text-contrast font-sans overflow-x-hidden selection:bg-primary selection:text-white antialiased">
    <div class="relative flex min-h-screen w-full flex-col group/design-root">
        <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary/10 blur-[100px] rounded-full smoke-blob"></div>
            <div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-purple-500/10 blur-[80px] rounded-full smoke-blob-2"></div>
            <div class="absolute bottom-[-10%] left-[-10%] w-[500px] h-[500px] bg-teal-400/10 blur-[80px] rounded-full smoke-blob"></div>
            <div class="absolute inset-0 opacity-[0.05] bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] z-10 mix-blend-overlay"></div>
        </div>
        <div class="layout-container flex h-full grow flex-col relative z-20">
            <div class="p-8 mx-8 flex justify-center">
                <div class="layout-content-container flex flex-col max-w-[1200px] flex-1">
                    <header class="flex items-center justify-center px-6 py-4">
                        <div class="flex items-center gap-3 text-text-contrast">
                            <div class="text-primary w-8 h-8 flex items-center justify-center">
                                <img src="/assets/logo-nox.svg" alt="BreakerSpace Logo" class="w-full h-full" />
                            </div>
                            <h2 class="text-text-contrast text-2xl font-logo font-light tracking-wide">BreakerSpace</h2>
                        </div>
                    </header>
                </div>
            </div>
            <main class="flex flex-1 flex-col justify-center items-center px-4 py-12">
                <div class="layout-content-container flex flex-col max-w-[960px] w-full items-center text-center">
                    <div class="animate-fade-in-up mb-8 inline-flex items-center gap-2 rounded-full border border-primary/20 bg-primary/5 px-4 py-1.5 backdrop-blur-sm shadow-[0_0_15px_rgba(0,170,255,0.05)]">
                        <span class="relative flex h-2 w-2">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2 w-2 bg-primary"></span>
                        </span>
                        <span class="text-xs font-bold tracking-[0.2em] text-primary uppercase font-sans">Ad Factores Mundi</span>
                    </div>
                    <h1 class="mb-8 text-5xl md:text-7xl lg:text-8xl font-black leading-[0.9] tracking-tighter text-text-contrast uppercase break-words max-w-5xl font-sans drop-shadow-2xl">
                        Break It<br/>
                        Till You<br/>
                        <span class="text-transparent bg-clip-text bg-gradient-to-r from-white via-primary to-white bg-[200%_auto] animate-[pulse_5s_ease-in-out_infinite]">
                            Make It
                        </span>
                    </h1>
                    <h2 class="mb-12 max-w-2xl text-lg md:text-xl text-text-secondary font-normal leading-relaxed">
                        The future is <span class="text-text-contrast">Made in India!</span>
                    </h2>
                    <button class="h-12 md:h-14 px-8 rounded-lg bg-primary hover:bg-sky-500 text-white text-base font-bold tracking-wide transition-all shadow-[0_0_20px_rgba(0,170,255,0.2)] hover:shadow-[0_0_30px_rgba(0,170,255,0.4)] hover:scale-[1.02] flex items-center justify-center gap-2 whitespace-nowrap" type="button">
                        <span>Coming Soon!</span>
                        <span class="material-symbols-outlined text-[20px]">bolt</span>
                    </button>
                </div>
            </main>
            <div class="px-4 py-8 flex justify-center mt-auto">
                <footer class="flex flex-col gap-8 w-full max-w-[960px] text-center">
                    <div class="mt-16 flex items-center justify-center gap-6 opacity-40 hover:opacity-80 transition-opacity duration-500">
                        <div class="h-[1px] w-32 bg-gradient-to-r from-transparent to-text-secondary"></div>
                        <span class="material-symbols-outlined text-text-secondary text-sm">all_inclusive</span>
                        <div class="h-[1px] w-32 bg-gradient-to-l from-transparent to-text-secondary"></div>
                    </div>
                    <div class="flex flex-wrap justify-center gap-6">
                        <a aria-label="Watch our videos on YouTube" class="text-text-secondary hover:text-text-contrast transition-all duration-300 p-3 bg-surface-dark/30 rounded-full hover:bg-surface-dark/80 hover:shadow-[0_0_20px_rgba(0,170,255,0.3)] group border border-transparent hover:border-primary/50 hover:scale-110" href="https://youtube.com/@BreakerSpace">
                            <img src="/assets/socials/youtube.png" alt="YouTube" class="w-5 h-5 opacity-60 group-hover:opacity-100 group-hover:brightness-110 transition-all duration-300 filter invert">
                        </a>
                        <a aria-label="Follow us on X for updates" class="text-text-secondary hover:text-text-contrast transition-all duration-300 p-3 bg-surface-dark/30 rounded-full hover:bg-surface-dark/80 hover:shadow-[0_0_20px_rgba(0,170,255,0.3)] group border border-transparent hover:border-primary/50 hover:scale-110" href="https://x.com/BreakerSpaceHQ">
                            <img src="/assets/socials/x.png" alt="X" class="w-5 h-5 opacity-60 group-hover:opacity-100 group-hover:brightness-110 transition-all duration-300 filter invert">
                        </a>
                        <a aria-label="Follow us on Instagram for BTS" class="text-text-secondary hover:text-text-contrast transition-all duration-300 p-3 bg-surface-dark/30 rounded-full hover:bg-surface-dark/80 hover:shadow-[0_0_20px_rgba(0,170,255,0.3)] group border border-transparent hover:border-primary/50 hover:scale-110" href="https://instagram.com/breakerspace">
                            <img src="/assets/socials/instagram.png" alt="Instagram" class="w-5 h-5 opacity-60 group-hover:opacity-100 group-hover:brightness-110 transition-all duration-300 filter invert">
                        </a>
                    </div>
                    <div class="flex flex-col items-center gap-3">
                        <p class="text-text-secondary/60 text-xs md:text-sm font-normal tracking-wide">© 2026 BreakerSpace Pvt. Ltd.</p>
                        <div class="flex items-center gap-2 opacity-50">
                            <div class="w-1 h-1 rounded-full bg-primary/40"></div>
                            <div class="w-1.5 h-1.5 rounded-full bg-primary/60 animate-pulse"></div>
                            <div class="w-1 h-1 rounded-full bg-primary/40"></div>
                        </div>
                    </div>
                </footer>
            </div>
        </div>
    </div>
</body>
</html>
